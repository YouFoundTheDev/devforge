apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ${{ values.name }}-api
  description: Health API for ${{ values.name }}.
spec:
  type: openapi
  lifecycle: production
  owner: ${{ values.owner }}
  system: devforge-platform
  definition: |
    openapi: 3.0.3
    info:
      title: ${{ values.name }} Health API
      version: 1.0.0
    paths:
      /health:
        get:
          summary: Return the service health status
          responses:
            '200':
              description: Service is healthy
