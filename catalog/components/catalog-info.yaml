apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: service-health-plugin
  description: Backstage plugin for aggregated service health and deployment status.
  tags:
    - backstage-plugin
    - react
    - typescript
  annotations:
    github.com/project-slug: devforge-labs/service-health-plugin
    backstage.io/techdocs-ref: dir:../../docs/services/service-health-plugin
  links:
    - url: https://github.com/devforge-labs/service-health-plugin
      title: Source repository
      icon: github
spec:
  type: library
  lifecycle: production
  owner: platform-team
  system: devforge-platform
  providesApis:
    - service-health-v1
  dependsOn:
    - component:default/identity-service
