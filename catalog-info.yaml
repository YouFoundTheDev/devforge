apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: devforge-portal
  description: Internal developer portal for service discovery and self-service.
  tags:
    - backstage
    - react
    - typescript
  annotations:
    github.com/project-slug: devforge-labs/devforge-portal
    backstage.io/techdocs-ref: dir:docs/services/devforge-portal
  links:
    - url: https://github.com/devforge-labs/devforge-portal
      title: Source repository
      icon: github
spec:
  type: website
  owner: platform-team
  lifecycle: production
  system: devforge-platform
  dependsOn:
    - component:default/service-health-plugin
  consumesApis:
    - service-health-v1
    - threat-intel-v1
    - incident-analysis-v1
    - identity-v1
