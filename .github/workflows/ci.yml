name: DevForge CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Dependency audit
        run: yarn npm audit --all --severity high
      - name: Check configuration
        run: yarn backstage-cli config:check --strict
      - name: Lint
        run: yarn lint:all
      - name: Typecheck
        run: yarn tsc
      - name: Build
        run: yarn build:all
      - name: Test
        run: yarn test
      - name: Verify generated service
        working-directory: templates/create-production-service/skeleton
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Build container
        run: yarn build-image
      - name: Scan container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: backstage
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
